<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MedLens — AI Clinical Intelligence & Reference-Range Engine</title>
  <meta name="description" content="MedLens is an AI-powered clinical information intelligence platform that structures patient intake data, extracts laboratory reports with verbatim reference ranges, and performs multi-visit analyte delta tracking.">
  <meta name="keywords" content="clinical intelligence, medical OCR, laboratory reports, reference ranges, patient timeline, delta tracking">
  <meta property="og:title" content="MedLens — AI Clinical Intelligence Platform">
  <meta property="og:description" content="AI Clinical Intelligence & Reference-Range Intelligence Engine for laboratory diagnostics and patient timelines.">
  <meta property="og:type" content="website">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
/* ==========================================================================
   MedLens Clinical Intelligence Design System
   Sleek Glassmorphism, Glowing Telemetry & Modern Medical UI Tokens
   ========================================================================== */

:root {
  --bg-main: #090e17;
  --bg-subtle: #0f172a;
  --bg-card: rgba(26, 38, 57, 0.65);
  --bg-card-hover: rgba(36, 52, 78, 0.85);
  --bg-input: #0c1424;
  --border-color: rgba(255, 255, 255, 0.08);
  --border-accent: rgba(56, 189, 248, 0.25);
  
  --text-main: #f8fafc;
  --text-muted: #94a3b8;
  --text-faint: #64748b;
  
  --accent-cyan: #06b6d4;
  --accent-primary: #0284c7;
  --accent-primary-hover: #0369a1;
  --accent-sky: #38bdf8;
  --accent-emerald: #10b981;
  --accent-amber: #f59e0b;
  --accent-rose: #f43f5e;
  --accent-purple: #8b5cf6;
  --accent-indigo: #6366f1;

  --badge-user: #0284c7;
  --badge-ai-extracted: #8b5cf6;
  --badge-ai-gen: #06b6d4;
  
  --status-high-bg: rgba(244, 63, 94, 0.12);
  --status-high-text: #fb7185;
  --status-high-border: rgba(244, 63, 94, 0.4);

  --status-low-bg: rgba(245, 158, 11, 0.12);
  --status-low-text: #fbbf24;
  --status-low-border: rgba(245, 158, 11, 0.4);

  --status-normal-bg: rgba(16, 185, 129, 0.12);
  --status-normal-text: #34d399;
  --status-normal-border: rgba(16, 185, 129, 0.4);

  --status-unknown-bg: rgba(148, 163, 184, 0.1);
  --status-unknown-text: #cbd5e1;
  --status-unknown-border: rgba(148, 163, 184, 0.3);

  --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.25);
  --shadow-md: 0 8px 24px -4px rgba(0, 0, 0, 0.45);
  --shadow-lg: 0 16px 36px -6px rgba(0, 0, 0, 0.6);
  --shadow-glow-cyan: 0 0 20px rgba(6, 182, 212, 0.3);
  
  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 16px;
  --radius-xl: 20px;
}

[data-theme="light"] {
  --bg-main: #f1f5f9;
  --bg-subtle: #ffffff;
  --bg-card: rgba(255, 255, 255, 0.9);
  --bg-card-hover: #ffffff;
  --bg-input: #f8fafc;
  --border-color: rgba(203, 213, 225, 0.8);
  --border-accent: rgba(2, 132, 199, 0.3);
  
  --text-main: #0f172a;
  --text-muted: #475569;
  --text-faint: #94a3b8;
  
  --accent-primary: #0284c7;
  --accent-primary-hover: #0369a1;
  --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.05);
  --shadow-md: 0 8px 20px -4px rgba(0, 0, 0, 0.08);
  --shadow-lg: 0 16px 32px -6px rgba(0, 0, 0, 0.12);
  --shadow-glow-cyan: 0 0 15px rgba(2, 132, 199, 0.2);

  --status-high-bg: #ffe4e6;
  --status-high-text: #e11d48;
  --status-high-border: #fda4af;

  --status-low-bg: #fef3c7;
  --status-low-text: #d97706;
  --status-low-border: #fcd34d;

  --status-normal-bg: #d1fae5;
  --status-normal-text: #059669;
  --status-normal-border: #6ee7b7;

  --status-unknown-bg: #f1f5f9;
  --status-unknown-text: #475569;
  --status-unknown-border: #cbd5e1;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  -webkit-font-smoothing: antialiased;
}

body {
  background-color: var(--bg-main);
  background-image: 
    radial-gradient(at 0% 0%, rgba(6, 182, 212, 0.08) 0px, transparent 50%),
    radial-gradient(at 100% 100%, rgba(139, 92, 246, 0.06) 0px, transparent 50%);
  background-attachment: fixed;
  color: var(--text-main);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

svg {
  max-width: 24px;
  max-height: 24px;
}

/* ==========================================================================
   Header Bar
   ========================================================================== */
.app-header {
  background: var(--bg-card);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--border-color);
  padding: 0.85rem 1.75rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: var(--shadow-sm);
}

.logo-container {
  display: flex;
  align-items: center;
  gap: 0.9rem;
}

.logo-icon {
  background: linear-gradient(135deg, #06b6d4, #0284c7 60%, #4f46e5);
  color: white;
  width: 42px;
  height: 42px;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 800;
  font-size: 1.3rem;
  box-shadow: var(--shadow-glow-cyan);
  border: 1px solid rgba(255, 255, 255, 0.2);
}

.logo-text h1 {
  font-size: 1.3rem;
  font-weight: 800;
  letter-spacing: -0.5px;
  background: linear-gradient(90deg, #38bdf8, #818cf8);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.logo-text p {
  font-size: 0.75rem;
  color: var(--text-muted);
  font-weight: 500;
}

.header-actions {
  display: flex;
  align-items: center;
  gap: 0.85rem;
  flex-wrap: wrap;
}

.patient-select-wrapper {
  display: flex;
  align-items: center;
  gap: 0.6rem;
  background: var(--bg-subtle);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-md);
  padding: 0.45rem 0.9rem;
  transition: all 0.2s ease;
}

.patient-select-wrapper:focus-within {
  border-color: var(--accent-cyan);
  box-shadow: 0 0 0 2px rgba(6, 182, 212, 0.2);
}

.patient-select-wrapper label {
  font-size: 0.75rem;
  color: var(--text-muted);
  font-weight: 700;
  letter-spacing: 0.5px;
}

.patient-select {
  background: transparent;
  color: var(--text-main);
  border: none;
  font-weight: 600;
  font-size: 0.875rem;
  outline: none;
  cursor: pointer;
  max-width: 260px;
}

.patient-select option {
  background: var(--bg-subtle);
  color: var(--text-main);
}

/* ==========================================================================
   App Container & Sidebar Navigation
   ========================================================================== */
.app-container {
  display: flex;
  flex: 1;
}

.app-sidebar {
  width: 270px;
  background: var(--bg-card);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-right: 1px solid var(--border-color);
  padding: 1.5rem 0.85rem;
  display: flex;
  flex-direction: column;
  gap: 0.4rem;
}

.nav-item {
  display: flex;
  align-items: center;
  gap: 0.85rem;
  padding: 0.75rem 1rem;
  border-radius: var(--radius-md);
  color: var(--text-muted);
  font-size: 0.875rem;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.2s ease;
  text-decoration: none;
  border: 1px solid transparent;
}

.nav-item:hover {
  background: var(--bg-card-hover);
  color: var(--text-main);
  border-color: var(--border-color);
  transform: translateX(2px);
}

.nav-item.active {
  background: linear-gradient(90deg, rgba(6, 182, 212, 0.15), rgba(2, 132, 199, 0.05));
  color: var(--accent-sky);
  font-weight: 600;
  border-color: rgba(6, 182, 212, 0.3);
  border-left: 3px solid var(--accent-cyan);
  box-shadow: 0 4px 12px rgba(6, 182, 212, 0.08);
}

.nav-item svg {
  width: 18px !important;
  height: 18px !important;
  max-width: 18px !important;
  max-height: 18px !important;
  flex-shrink: 0;
}

/* ==========================================================================
   Main Content Area
   ========================================================================== */
.main-content {
  flex: 1;
  padding: 1.75rem 2.25rem;
  overflow-y: auto;
  max-width: 1440px;
  margin: 0 auto;
  width: 100%;
}

/* Safety Disclaimer Banner */
.safety-banner {
  background: linear-gradient(90deg, rgba(6, 182, 212, 0.1), rgba(2, 132, 199, 0.05));
  border: 1px solid rgba(6, 182, 212, 0.3);
  border-radius: var(--radius-md);
  padding: 0.85rem 1.25rem;
  margin-bottom: 1.5rem;
  display: flex;
  align-items: center;
  gap: 0.9rem;
  font-size: 0.85rem;
  color: #38bdf8;
  box-shadow: 0 2px 10px rgba(6, 182, 212, 0.06);
}

.safety-banner svg {
  flex-shrink: 0;
  color: var(--accent-cyan);
}

/* ==========================================================================
   Cards & Modern Glassmorphic Grids
   ========================================================================== */
.dashboard-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
  gap: 1.5rem;
  margin-bottom: 1.5rem;
}

.card {
  background: var(--bg-card);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-lg);
  padding: 1.35rem;
  box-shadow: var(--shadow-md);
  transition: border-color 0.2s ease, box-shadow 0.2s ease;
}

.card:hover {
  border-color: var(--border-accent);
  box-shadow: var(--shadow-lg);
}

.card-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 1.1rem;
  padding-bottom: 0.6rem;
  border-bottom: 1px solid var(--border-color);
}

.card-title {
  font-size: 1rem;
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: 0.6rem;
  color: var(--text-main);
}

/* ==========================================================================
   Badges & Micro Status Tags
   ========================================================================== */
.badge {
  display: inline-flex;
  align-items: center;
  gap: 0.35rem;
  padding: 0.25rem 0.65rem;
  border-radius: 9999px;
  font-size: 0.725rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.badge-high {
  background: var(--status-high-bg);
  color: var(--status-high-text);
  border: 1px solid var(--status-high-border);
}

.badge-low {
  background: var(--status-low-bg);
  color: var(--status-low-text);
  border: 1px solid var(--status-low-border);
}

.badge-normal {
  background: var(--status-normal-bg);
  color: var(--status-normal-text);
  border: 1px solid var(--status-normal-border);
}

.badge-unknown {
  background: var(--status-unknown-bg);
  color: var(--status-unknown-text);
  border: 1px solid var(--status-unknown-border);
}

.badge-user {
  background: rgba(2, 132, 199, 0.15);
  color: #38bdf8;
  border: 1px solid rgba(2, 132, 199, 0.4);
}

.badge-ai-extracted {
  background: rgba(139, 92, 246, 0.15);
  color: #c084fc;
  border: 1px solid rgba(139, 92, 246, 0.4);
}

.badge-ai-gen {
  background: rgba(6, 182, 212, 0.15);
  color: #22d3ee;
  border: 1px solid rgba(6, 182, 212, 0.4);
}

/* ==========================================================================
   Data Tables
   ========================================================================== */
.data-table-container {
  overflow-x: auto;
  margin-top: 0.5rem;
  border-radius: var(--radius-md);
  border: 1px solid var(--border-color);
}

.data-table {
  width: 100%;
  border-collapse: collapse;
  text-align: left;
  font-size: 0.875rem;
}

.data-table th {
  background: rgba(12, 20, 36, 0.85);
  color: var(--text-muted);
  font-weight: 600;
  padding: 0.85rem 1.1rem;
  border-bottom: 1px solid var(--border-color);
  white-space: nowrap;
  letter-spacing: 0.3px;
  font-size: 0.8rem;
}

.data-table td {
  padding: 0.95rem 1.1rem;
  border-bottom: 1px solid var(--border-color);
  color: var(--text-main);
  vertical-align: middle;
}

.data-table tr:hover {
  background: var(--bg-card-hover);
}

.data-table code {
  font-family: 'Fira Code', monospace;
  background: rgba(15, 23, 42, 0.6);
  padding: 0.2rem 0.45rem;
  border-radius: var(--radius-sm);
  font-size: 0.8rem;
  color: #38bdf8;
  border: 1px solid rgba(255, 255, 255, 0.05);
}

.trend-arrow-up {
  color: var(--accent-rose);
  font-weight: 700;
}

.trend-arrow-down {
  color: var(--accent-emerald);
  font-weight: 700;
}

.trend-arrow-steady {
  color: var(--text-muted);
  font-weight: 600;
}

/* ==========================================================================
   Buttons & Controls
   ========================================================================== */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.5rem;
  padding: 0.55rem 1.1rem;
  border-radius: var(--radius-md);
  font-size: 0.875rem;
  font-weight: 600;
  cursor: pointer;
  border: 1px solid transparent;
  transition: all 0.2s ease;
  text-decoration: none;
}

.btn:active {
  transform: scale(0.98);
}

.btn-primary {
  background: linear-gradient(135deg, #0284c7, #0369a1);
  color: white;
  box-shadow: 0 4px 12px rgba(2, 132, 199, 0.3);
}

.btn-primary:hover {
  background: linear-gradient(135deg, #0369a1, #075985);
  box-shadow: 0 6px 16px rgba(2, 132, 199, 0.45);
}

.btn-secondary {
  background: var(--bg-card-hover);
  color: var(--text-main);
  border-color: var(--border-color);
}

.btn-secondary:hover {
  background: var(--border-color);
  border-color: var(--border-accent);
}

.btn-success {
  background: #059669;
  color: white;
}

.btn-success:hover {
  background: #047857;
}

.btn-danger {
  background: #dc2626;
  color: white;
}

.btn-danger:hover {
  background: #b91c1c;
}

.btn-sm {
  padding: 0.35rem 0.75rem;
  font-size: 0.78rem;
}

/* ==========================================================================
   Forms & Controls
   ========================================================================== */
.form-group {
  margin-bottom: 1.1rem;
}

.form-group label {
  display: block;
  font-size: 0.85rem;
  font-weight: 600;
  color: var(--text-muted);
  margin-bottom: 0.4rem;
}

.form-control {
  width: 100%;
  padding: 0.7rem 0.9rem;
  background: var(--bg-input);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-md);
  color: var(--text-main);
  font-size: 0.9rem;
  outline: none;
  transition: all 0.2s ease;
}

.form-control:focus {
  border-color: var(--accent-cyan);
  box-shadow: 0 0 0 2px rgba(6, 182, 212, 0.25);
  background: rgba(12, 20, 36, 0.9);
}

textarea.form-control {
  resize: vertical;
  min-height: 110px;
  line-height: 1.5;
}

/* ==========================================================================
   Timeline
   ========================================================================== */
.timeline {
  position: relative;
  padding-left: 2rem;
  margin-top: 1rem;
}

.timeline::before {
  content: '';
  position: absolute;
  left: 0.75rem;
  top: 0;
  bottom: 0;
  width: 2px;
  background: linear-gradient(180deg, var(--accent-cyan), rgba(6, 182, 212, 0.1));
}

.timeline-item {
  position: relative;
  margin-bottom: 1.5rem;
}

.timeline-dot {
  position: absolute;
  left: -1.65rem;
  top: 0.35rem;
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: var(--accent-cyan);
  border: 3px solid var(--bg-main);
  box-shadow: 0 0 8px rgba(6, 182, 212, 0.6);
}

.timeline-content {
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-md);
  padding: 1.1rem;
  box-shadow: var(--shadow-sm);
}

.timeline-date {
  font-size: 0.75rem;
  color: var(--accent-sky);
  font-weight: 700;
}

.timeline-title {
  font-size: 1rem;
  font-weight: 700;
  margin: 0.3rem 0 0.4rem;
  color: var(--text-main);
}

.timeline-summary {
  font-size: 0.85rem;
  color: var(--text-muted);
  line-height: 1.5;
}

/* ==========================================================================
   Tabs Header
   ========================================================================== */
.view-tabs {
  display: flex;
  gap: 0.5rem;
  border-bottom: 1px solid var(--border-color);
  margin-bottom: 1.5rem;
  overflow-x: auto;
}

.view-tab {
  padding: 0.7rem 1.3rem;
  font-size: 0.9rem;
  font-weight: 600;
  color: var(--text-muted);
  cursor: pointer;
  border-bottom: 2px solid transparent;
  transition: all 0.2s;
  white-space: nowrap;
}

.view-tab:hover {
  color: var(--text-main);
}

.view-tab.active {
  color: var(--accent-cyan);
  border-bottom-color: var(--accent-cyan);
}

@media (max-width: 960px) {
  .app-container {
    flex-direction: column;
  }

  .app-sidebar {
    width: 100%;
    border-right: none;
    border-bottom: 1px solid var(--border-color);
    flex-direction: row;
    overflow-x: auto;
    padding: 0.75rem;
  }

  .nav-item {
    white-space: nowrap;
  }

  .main-content {
    padding: 1.25rem;
  }
}
  </style>
</head>
